# Large bond dimension, binary N = 8 (K = 7), d = 3, uncapped chi = 4..32 (internal cores chi^3),
# sp / ntk / mup, plain model (the centred model doubles every bond), sigma = 1.0, dopri5.
exp: large_chi_b8
base: {kind: binary, n: 8, d: 3, cap: false, model: plain, sigma: 1.0, l_floor: 1.0e-6}
grid:
  chi: [4, 8, 16, 32]
  lr: [sp, ntk, mup]
  seed: [0, 1, 2, 3, 4, 5]
