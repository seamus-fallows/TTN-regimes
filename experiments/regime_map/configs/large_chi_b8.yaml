# Large bond dimension at K = 7: binary N = 8, d = 2, odeco [3, 2], uncapped chi = 4..32 (internal
# cores chi^3), sp / ntk / mup, plain model (theory_regimes P17 setting), sigma = 1.0, dopri5.
exp: large_chi_b8
base: {kind: binary, n: 8, d: 2, cap: false, model: plain, sigma: 1.0, weights: [3.0, 2.0], l_floor: 1.0e-6, max_steps: 10000}
grid:
  chi: [4, 8, 16, 32]
  lr: [sp, ntk, mup]
  seed: [0, 1, 2, 3, 4, 5]
