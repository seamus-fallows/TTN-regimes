# sigma x chi, binary N = 8 (K = 7), d = 3, odeco [3, 2, 1], centred model, gradient flow.
# chi <= 81 with capped bonds (bottom bonds <= 9; chi = 81: every bond full, square cores);
# chi = 162 stands for 'full2x' bonds 18 (2 sites) / 162 (4 sites) = twice the cut dimension.
# LSODA (exact Hessian) for sigma < 0.7 where P is small; dopri5 otherwise. Deficient bonds
# (chi < 81) stall at the unrealizable best fit at large sigma, so they stop at sigma = 4; large-P
# runs start at sigma = 0.3-0.4 (later plateaus ~1e2-1e3 time units, stiff for explicit steps).
# max_steps 3e4 bounds the stiff lazy fit at square cores (chi = 81, theory P7).
exp: sigma_chi_b8
base: {kind: binary, n: 8, d: 3, cap: true, model: centred, l_floor: 1.0e-6, max_steps: 30000}
grid: {seed: [0, 1, 2, 3, 4, 5]}
variants:
  - {chi: 3, method: auto, sigmas: {geomspace: [0.15, 4, 12]}}
  - {chi: 6, method: auto, sigmas: {geomspace: [0.15, 4, 12]}}
  - {chi: 12, method: auto, sigmas: {geomspace: [0.25, 4, 10]}}
  - {chi: 24, method: dopri5, sigmas: {geomspace: [0.3, 4, 9]}}
  - {chi: 81, method: dopri5, sigmas: {geomspace: [0.4, 30, 11]}}
  - {chi: 162, cap: false, bonds: {2: 18, 4: 162}, method: dopri5, sigmas: {geomspace: [0.4, 30, 11]}}
