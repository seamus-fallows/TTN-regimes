# Main small-init sweep (steps 3-4 of the brief): MNIST 3 vs 5, 4x4, chi = 4, gradient flow
# (DP5 to the first escape, then LSODA rtol 1e-8 / atol 1e-14 for tau = 1e4).
# sigma: 7 values over one decade; seeds 0-4 (init stream; data seed 0 fixed).
defaults: {t2: 1.0e+4, n_per_decade: 30, n_linear: 1000, wall_limit: 5400, chi: 4}
cases:
  - {tree: binary, ordering: quadtree, features: raw, sigmas: [0.05, 0.07, 0.1, 0.14, 0.2, 0.3, 0.5], seeds: [0, 1, 2, 3, 4]}
  - {tree: mps, ordering: snake, features: raw, sigmas: [0.05, 0.07, 0.1, 0.14, 0.2, 0.3, 0.5], seeds: [0, 1, 2, 3, 4]}
  - {tree: binary, ordering: scrambled0, features: raw, sigmas: [0.05, 0.07, 0.1, 0.14, 0.2, 0.3, 0.5], seeds: [0, 1, 2, 3, 4]}
  - {tree: binary, ordering: scrambled1, features: raw, sigmas: [0.05, 0.07, 0.1, 0.14, 0.2, 0.3, 0.5], seeds: [0, 1, 2, 3, 4]}
  - {tree: binary, ordering: scrambled2, features: raw, sigmas: [0.05, 0.07, 0.1, 0.14, 0.2, 0.3, 0.5], seeds: [0, 1, 2, 3, 4]}
  - {tree: binary, ordering: quadtree, features: white, sigmas: [0.05, 0.07, 0.1, 0.14, 0.2, 0.3, 0.5], seeds: [0, 1, 2, 3, 4]}
  - {tree: mps, ordering: snake, features: white, sigmas: [0.05, 0.07, 0.1, 0.14, 0.2, 0.3, 0.5], seeds: [0, 1, 2, 3, 4]}
  - {tree: binary, ordering: scrambled0, features: white, sigmas: [0.05, 0.07, 0.1, 0.14, 0.2, 0.3, 0.5], seeds: [0, 1, 2, 3, 4]}
