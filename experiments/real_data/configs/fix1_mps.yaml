# Fix round 1 (local reruns, 2026-10-10): the 35 snake-MPS cases of main.yaml (raw features, sigma 0.05-0.5,
# seeds 0-4) with a shorter phase 2 (tau <= 1000, same linear-grid spacing of 10 time units; tag "t1000").
# Purpose: whether the first rank increase (edge 5) is resolved or already above threshold at tau = 0, its
# timing relative to the first loss drop, and log- vs power-law fits with relative residuals for the MPS
# edges that gain rank within tau = 1000. Phase 1 is identical to main.yaml; in phase 2 the shorter time
# grid moves the integrator's clamped steps, so event times agree with the full-horizon runs only within
# the integration tolerance (the round-1 reviewers' short reruns matched the committed gaps within 0.3%).
defaults: {t2: 1000, n_per_decade: 30, n_linear: 100, wall_limit: 5400, chi: 4, tag: t1000}
cases:
  - {tree: mps, ordering: snake, features: raw, sigmas: [0.05, 0.07, 0.1, 0.14, 0.2, 0.3, 0.5], seeds: [0, 1, 2, 3, 4]}
