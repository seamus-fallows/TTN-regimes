# Robustness: bond dimension chi = 8 (bottom bonds capped at 4 by the 2-site cut), raw features,
# three trees, three sigma over one decade, seeds 0-4.
defaults: {t2: 1.0e+4, n_per_decade: 30, n_linear: 1000, wall_limit: 7200, chi: 8}
cases:
  - {tree: binary, ordering: quadtree, features: raw, sigmas: [0.05, 0.14, 0.5], seeds: [0, 1, 2, 3, 4]}
  - {tree: mps, ordering: snake, features: raw, sigmas: [0.05, 0.14, 0.5], seeds: [0, 1, 2, 3, 4]}
  - {tree: binary, ordering: scrambled0, features: raw, sigmas: [0.05, 0.14, 0.5], seeds: [0, 1, 2, 3, 4]}
