# Step 1: order statistics for two-component odeco teachers (weights 1, rho).
# Full gradient flow (RK45, rtol 1e-9, atol 1e-14) to the first learning event, sigma = 0.01,
# common seeds across rho; plus per-component leading-order blow-up times (race model) and
# init statistics. 28 distinct settings x 400 seeds x 6 rho.
name: main
trees: ["binary:4", "binary:8", "mps:4", "mps:6", "mps:8"]
d: [2, 4]
chi: [2, 4, 8]
rho: [0.5, 0.7, 0.8, 0.9, 0.95, 0.99]
sigma: [0.01]
seeds: 400
proxies: true
lo_race: true
