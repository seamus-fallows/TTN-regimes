# Registered grid (notes/route_smallinit.md, sec. 4); floor check changed after deviation 3 (Part III)
targets: configs/targets.yaml
sigma: {log10_max: -1.5, log10_min: -5.0, step: 0.25}   # 15 values, quarter decades
seeds: 40                                               # fan-in init spec.init(sigma, seed)
wall: 10800                                             # deviation 7: PS runs unfinished after 1 h, rerun with 3 h
floor_check:
  reorder_n_smallest_sigmas: 3   # every seed: duplicate with another contraction order (other roundoff)
  lib_n_smallest_sigmas: 1       # library norm-form arithmetic (larger roundoff), seeds 0..lib_seeds-1
  lib_seeds: 10
  lib_wall: 1800
integrator: vode   # deviation 7: BDF from the start for the PS runs that crawled under LSODA
