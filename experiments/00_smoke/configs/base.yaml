# Smoke test of the pipeline: stage-like (saddle-to-saddle) learning in the simplest setting.
# Binary tree with N = 4 sites (K = 3 cores), d = 3, chi = 3; odeco teacher with weights 3, 2, 1
# (plateau levels L_k = 7, 2.5, 0.5); fan-in init at sigma = 0.05; exact population loss
# (whitened inputs); gradient flow (Dormand-Prince 5(4), rtol 1e-8, atol 1e-12) until L < 1e-10.
# Fields not given here take the defaults of ttn/config.py.
name: smoke
seed: 0
tree: {kind: binary, n_sites: 4}
d: 3
chi: 3
init: {scheme: fanin, sigma: 0.05}
teacher:
  kind: odeco
  weights: [3.0, 2.0, 1.0]
  seed: 0  # one fixed teacher for every run; the run seed only changes the init
optimizer:
  kind: gf
  method: dopri5
  t_max: 1.0e+5
  rtol: 1.0e-8
  atol: 1.0e-12
  loss_floor: 1.0e-10
logging:
  n_log: 200
  ntk_probe: 128  # tangent kernel on 128 probe inputs -> delta_K and the regime label
