# Round 2, item 1: extension of the saddle-start sigma range (review of round 1: reach the asymptotic
# regime). MPS (log law): down to 1e-8; binary / HT (3-core route, escape signal ~ c eps^2): down to 1e-5
# only, since below that the route's gradient approaches float64 roundoff. Same teachers as
# r2_saddle.yaml plus the balanced N = 8 misaligned teacher of r2_saddle_b.yaml.
name: r2_saddle
out_tag: r2_saddle_ext
t_cap: 1.0e+11
trees:
  4: [mps, binary, ht]
  8: [mps, binary, ht]
teachers:
  4:
    nonorth_c0.2: {kind: nonorth, args: {c: 0.2}}
    nonorth_c0.45: {kind: nonorth, args: {c: 0.45}}
    misaligned_20: {kind: misaligned, args: {theta_deg: 20, alpha: 1.0}}
    randbin_302: {kind: random_binary, args: {teacher_seed: 302, decay: 1.0}}
    randbin_303: {kind: random_binary, args: {teacher_seed: 303, decay: 1.0}}
    randmps_301: {kind: random_mps, args: {teacher_seed: 301, decay: 1.5}}
  8:
    nonorth8_c0.45: {kind: nonorth, args: {c: 0.45}}
    nonorth8_c0.7: {kind: nonorth, args: {c: 0.7}}
    misaligned8_45: {kind: misaligned, args: {theta_deg: 45, alpha: 2.0}}
    randbin8_302: {kind: random_binary, args: {teacher_seed: 302, decay: 1.0}}
    randbin8_303: {kind: random_binary, args: {teacher_seed: 303, decay: 1.0}}
    randmps8_303: {kind: random_mps, args: {teacher_seed: 303, decay: 1.5}}
sigmas:
  mps: [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4]
  binary: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4]
  ht: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4]
seeds: [0, 5]
