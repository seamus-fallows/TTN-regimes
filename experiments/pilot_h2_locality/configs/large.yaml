# Larger trees: MPS N = 6 (K = 6) and binary N = 8 (K = 7). The "sitesA-B" kinds scan the number k
# of cores that must change at fixed tree (MPS6: k = 2..6; binary8: k = 1, 3, 5, 7).
out_dir: data/pilot_h2_locality/runs
csv: runs.csv
method: LSODA
rtol: 1.0e-10
wall_limit: 400
# Stuck runs collapse to the rank-one saddle (2nd bond singular values ~1e-15) well within this horizon
# (see calibration); following them further only costs time.
t_max_factor: 1.0e+4
workers: 8
seeds: [0, 1, 2, 3, 4, 5]
groups:
  - tree: mps
    n: 6
    kinds: [local, sites0-2, sites0-3, sites0-4, far, global]
    sigmas: [0.3, 0.2, 0.15, 0.1, 0.07, 0.05]
  - tree: binary
    n: 8
    kinds: [local, sites0-2, far, global]
    sigmas: [0.3, 0.2, 0.15, 0.1, 0.07]
