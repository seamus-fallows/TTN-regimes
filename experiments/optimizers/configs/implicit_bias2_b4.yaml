# Finite samples, round 2 (review round 1, issue 5): several independent data draws, paired comparisons per
# draw. binary N=4, d=3, chi=4, odeco (3, 2, 1); n = 45 (dimension of the rank-(3,3) manifold) and 60; 4 data
# draws (data_seed, independent of the init seed) x 6 init seeds; trained to empirical loss < 1e-8 L0.
name: implicit_bias2_b4
blocks:
  - base: {tree: binary, n_sites: 4, d: 3, chi: 4, teacher: odeco, weights: [3.0, 2.0, 1.0], teacher_seed: 100}
    grid: {n_samples: [45, 60], data_seed: [200, 201, 202, 203], sigma: [0.01, 0.1], seed: [0, 1, 2, 3, 4, 5]}
    optimizers:
      - {optimizer: gf, t_max: 1.0e6, tol: 1.0e-8, gf_events: exact}
      - {optimizer: adam, lr: [1.0e-3, 1.0e-2], n_steps: 500000, tol: 1.0e-8}
